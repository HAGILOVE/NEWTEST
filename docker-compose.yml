version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kakaochat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kakaochat
      POSTGRES_PASSWORD: kakaochat_password
      POSTGRES_DB: kakaochat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kakaochat-network

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: kakaochat-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: kakaochat
      MONGO_INITDB_ROOT_PASSWORD: kakaochat_password
      MONGO_INITDB_DATABASE: kakaochat
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - kakaochat-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kakaochat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kakaochat-network

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kakaochat-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://kakaochat:kakaochat_password@postgres:5432/kakaochat?schema=public
      MONGODB_URI: mongodb://kakaochat:kakaochat_password@mongodb:27017/kakaochat?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_REFRESH_SECRET: your_super_secret_refresh_key_change_this_in_production
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - kakaochat-network

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kakaochat-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - kakaochat-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  kakaochat-network:
    driver: bridge
